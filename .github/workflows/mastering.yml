name: Drop The Raw - Headless Mastering Foundry

on:
  push:
    branches:
      - 'raw/**'
      - 'staging/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target raw or staging branch to master (must NOT be main)'
        required: true
        default: 'staging'

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: write
  issues: write

jobs:
  mastering:
    name: Autonomous Headless Mastering
    runs-on: ubuntu-latest
    if: "(github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) && github.actor != 'drop-the-raw-bot'"

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Verify Non-Main Safety Gate
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          echo "Target Branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "❌ FATAL: Cannot run Drop The Raw directly on 'main'. Raw code must be submitted via a raw/staging branch."
            exit 1
          fi
          echo "✔ Safety Gate Verified: $BRANCH_NAME is an isolated non-main branch."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Autonomous Coding Squad (Kilo CLI & OpenCode)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          echo "▶ Installing Kilo Code CLI (@kilocode/cli)..."
          npm install -g @kilocode/cli
          echo "▶ Installing OpenCode CLI (opencode-ai)..."
          npm install -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
          echo "▶ Generating runtime Kilo & OpenCode configurations with wholesale credentials..."
          node scripts/setup-runners.mjs
          echo "✔ Headless autonomous coding squad installed and dynamically configured."

      - name: Run Migration Replay Gate
        run: npm run test:migrations

      - name: Execute Headless Autonomous Mastering (Kilo & OpenCode)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          echo "▶ Triggering autonomous non-interactive mastering run..."
          kilo run --auto --model "openrouter/anthropic/claude-sonnet-4" "You are the Headless Autonomous Engineer for drop-the-raw. Inspect raw prototype code in src/. Refactor it into clean modular architecture (<50 lines per module), enforce Zero Trust controls (robots.txt, Turnstile, WAF), and write comprehensive unit tests in test/. Ensure npm test passes with zero failures." < /dev/null || {
            echo "⚠️ Primary mastering pass signaled fallback. Invoking OpenCode runtime..."
            opencode run --auto --model "openrouter/anthropic/claude-sonnet-4" "You are the Headless Autonomous Engineer for drop-the-raw. Inspect raw prototype code in src/. Refactor it into clean modular architecture, enforce Zero Trust controls, and ensure npm test passes." < /dev/null
          }

      - name: Post-Mastering Test Verification
        run: npm test

      - name: Commit Mastered Artifacts & Open Review Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "▶ Changes detected post-mastering. Committing to $BRANCH_NAME..."
            git config --local user.name "drop-the-raw-bot"
            git config --local user.email "bot@company.help"
            git add -A
            git commit -m "chore(mastering): autonomous refactor and hardening [skip ci]"
            git push origin "$BRANCH_NAME"

            echo "▶ Opening Pull Request to main for owner review..."
            gh pr create \
              --title "🚀 [MASTERED] Autonomous Refactor for $BRANCH_NAME" \
              --body "### Autonomous Headless Mastering Summary
            - **Source Staging Branch**: \`$BRANCH_NAME\`
            - **Target Production Branch**: \`main\`
            - **Squad**: Kilo Code CLI & OpenCode (via Claude Sonnet 4)
            - **Test Status**: \`npm test\` passed with 100% success
            - **Zero-Trust Hardening**: robots.txt, Turnstile, and modular architecture applied.

            *Changes are staged and ready for owner review and merge.*" \
              --base main \
              --head "$BRANCH_NAME" || echo "Notice: Pull Request already exists or updated."
          else
            echo "✔ Clean tree. No refactor changes required."
          fi

      - name: Attempt Autonomous Self-Healing on Failure
        if: failure() && env.OPENROUTER_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          echo "⚠️ Failure detected in pipeline. Routing directly to Headless Engineering Team (Kilo + OpenCode)..."
          kilo run --auto --model "openrouter/anthropic/claude-sonnet-4" "CRITICAL: The pipeline failed during test qualification. Inspect the repository, identify the failing tests or broken syntax, refactor the code to resolve the errors, and ensure npm test passes." < /dev/null || {
            echo "⚠️ Primary self-healing failed. Engaging OpenCode autonomous repair..."
            opencode run --auto --model "openrouter/anthropic/claude-sonnet-4" "CRITICAL: The pipeline failed during test qualification. Inspect failing tests, fix the broken syntax or tests, and ensure npm test passes." < /dev/null
          }
          npm test
          if [ -n "$(git status --porcelain)" ]; then
            echo "✔ Self-healing successful. Committing autonomous repair to $BRANCH_NAME..."
            git config --local user.name "drop-the-raw-bot"
            git config --local user.email "bot@company.help"
            git add -A
            git commit -m "fix(self-healing): autonomous repair of qualification failure [skip ci]"
            git push origin "$BRANCH_NAME"
          fi


      - name: Open Autonomous Incident Ticket on Unresolved Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📢 Logging Autonomous Incident Ticket to GitHub Issues (Zero Human Inbox Spam)..."
          gh issue create \
            --title "🚨 [AUTONOMOUS INCIDENT] Pipeline Qualification Failure on commit ${{ github.sha }}" \
            --body "### Autonomous Incident Report
          - **Trigger Commit**: \`${{ github.sha }}\`
          - **Actor**: \`${{ github.actor }}\`
          - **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Incident Status**: Escalated to Autonomous Headless Queue
          - **Assigned To**: Headless Engineering Squad (Kilo / OpenCode)

          *Automated by Drop The Raw Zero-Inbox Protocol.*" || echo "Notice: Incident logged."

      - name: Publish Foundry Summary
        if: always()
        run: |
          echo "### 🚀 Drop The Raw — Mastering Gate Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Status**: Passed ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: Escalated to Headless Incident Tracker ⚠️" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pipeline**: Zero-Trust & Migration Replay Evaluated" >> $GITHUB_STEP_SUMMARY
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "- **Note**: \`OPENROUTER_API_KEY\` not set. To activate autonomous Kilo & OpenCode refactoring and self-healing, add it to Repository Secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Autonomous Squad**: Kilo CLI & OpenCode Active via OpenRouter Wholesale Routing" >> $GITHUB_STEP_SUMMARY
          fi
